name: 'Build Docker Embedded (Opção 1)'

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    # Executar automaticamente toda segunda-feira às 9h
    - cron: '0 9 * * 1'

permissions:
  contents: write

jobs:
  build-docker-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PostgreSQL image
        run: |
          docker pull postgres:15-alpine
          docker save postgres:15-alpine -o postgres.tar

      - name: Build Backend image
        run: |
          cd residencia4-backend-master
          docker build -t globo-backend:latest .
          docker save globo-backend:latest -o ../backend.tar

      - name: Build IA Service image
        run: |
          cd residencia4-ia-main
          docker build -t globo-ia-service:latest .
          docker save globo-ia-service:latest -o ../ia-service.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            postgres.tar
            backend.tar
            ia-service.tar

  build-tauri-embedded:
    needs: build-docker-images
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: Globo-Front-main/src-tauri/resources/docker-images/

      - name: Download Docker Desktop Installer
        run: |
          mkdir -p Globo-Front-main/src-tauri/resources/installers
          # Download Docker Desktop for Windows
          curl -L "https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe" -o Globo-Front-main/src-tauri/resources/installers/docker-desktop-installer.exe

      - name: Create setup scripts
        run: |
          mkdir -p Globo-Front-main/src-tauri/scripts
          
          # Windows setup script
          cat > Globo-Front-main/src-tauri/scripts/setup-docker.ps1 << 'EOF'
          # Docker Embedded Setup Script for Windows
          Write-Host "Verificando Docker Desktop..."
          
          if (!(Get-Command docker -ErrorAction SilentlyContinue)) {
              Write-Host "Instalando Docker Desktop..."
              Start-Process -Wait -FilePath ".\resources\installers\docker-desktop-installer.exe" -ArgumentList "install", "--quiet"
              
              Write-Host "Aguardando inicialização do Docker..."
              Start-Sleep -Seconds 30
              
              # Carregar imagens Docker
              Write-Host "Carregando imagens Docker..."
              docker load -i ".\resources\docker-images\postgres.tar"
              docker load -i ".\resources\docker-images\backend.tar"
              docker load -i ".\resources\docker-images\ia-service.tar"
          }
          
          Write-Host "Docker configurado com sucesso!"
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Globo-Front-main/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: Globo-Front-main
        run: npm install --legacy-peer-deps

      - name: Build Frontend
        working-directory: Globo-Front-main
        run: npm run build

      - name: Update tauri.conf.json for embedded resources
        working-directory: Globo-Front-main
        run: |
          # Adicionar recursos ao bundle
          node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          
          config.bundle = config.bundle || {};
          config.bundle.resources = [
            '../docker-compose.yml',
            '../.env',
            '../residencia4-backend-master',
            '../residencia4-ia-main',
            'resources/docker-images/postgres.tar',
            'resources/docker-images/backend.tar',
            'resources/docker-images/ia-service.tar',
            'resources/installers/docker-desktop-installer.exe',
            'scripts/setup-docker.ps1'
          ];
          
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(config, null, 2));
          "

      - name: Build Tauri app with embedded Docker
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: Globo-Front-main/src-tauri
          tagName: ${{ github.ref_name }}-docker-embedded
          releaseName: 'Globo Monitor Docker Embedded v__VERSION__'
          releaseBody: 'Versão com Docker Desktop e imagens pré-carregadas incluídas no instalador.'
          releaseDraft: true
          prerelease: false

      - name: Upload embedded artifacts
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v4
        with:
          name: globo-monitor-docker-embedded-${{ matrix.platform }}
          path: |
            Globo-Front-main/src-tauri/target/release/bundle/msi/*.msi
            Globo-Front-main/src-tauri/target/release/bundle/nsis/*.exe
            Globo-Front-main/src-tauri/target/release/bundle/dmg/*.dmg
            Globo-Front-main/src-tauri/target/release/bundle/deb/*.deb
            Globo-Front-main/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

  create-release:
    needs: build-tauri-embedded
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}-docker-embedded
          name: 🎬 Globo Monitor v${{ github.run_number }} - Docker Embarcado
          body: |
            # 🎬 Globo Monitor v${{ github.run_number }}
            
            Sistema completo de monitoramento de qualidade de vídeo com Inteligência Artificial.
            
            ## ✨ Novidades
            - 📦 **Docker Embarcado**: Todos os serviços incluídos no instalador
            - 🚀 **Instalação Automática**: Docker Desktop e imagens pré-carregadas
            - 🖥️ **Multi-plataforma**: Windows, macOS e Linux
            
            ## 📋 Requisitos
            - Windows 10/11, macOS 10.15+, ou Linux moderno
            - 4GB RAM mínimo
            - 2GB espaço em disco
            
            ## 🔧 Instalação
            1. Baixe o instalador para seu sistema operacional
            2. Execute o instalador
            3. O aplicativo iniciará automaticamente com todos os serviços
            
            ## 🎯 Funcionalidades
            - Monitoramento em tempo real
            - Detecção de falhas de áudio/vídeo
            - Análise de inteligibilidade
            - Detecção de lip-sync
            - Dashboard interativo
            - Notificações automáticas
            
            ## 🐳 Tecnologias Incluídas
            - PostgreSQL 15
            - FastAPI Backend
            - IA com PyTorch/TensorFlow
            - Angular 20 + Tauri 2
            - Docker Compose
            
            ---
            **Instaladores pré-configurados com todos os serviços Docker**
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}