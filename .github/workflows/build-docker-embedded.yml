name: 'Build Docker Embedded (Opção 1)'

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    # Executar automaticamente toda segunda-feira às 9h
    - cron: '0 9 * * 1'

permissions:
  contents: write

jobs:
  build-docker-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PostgreSQL image
        run: |
          docker pull postgres:15-alpine
          docker save postgres:15-alpine -o postgres.tar

      - name: Build Backend image
        run: |
          cd residencia4-backend-master
          docker build -t globo-backend:latest .
          docker save globo-backend:latest -o ../backend.tar

      - name: Build IA Service image
        run: |
          cd residencia4-ia-main
          docker build -t globo-ia-service:latest .
          docker save globo-ia-service:latest -o ../ia-service.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            postgres.tar
            backend.tar
            ia-service.tar

  build-tauri-embedded:
    needs: build-docker-images
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy essential files to resources (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p Globo-Front-main/src-tauri/resources
          cp docker-compose.yml Globo-Front-main/src-tauri/resources/
          cp .env Globo-Front-main/src-tauri/resources/
          cp -r residencia4-backend-master Globo-Front-main/src-tauri/resources/
          cp -r residencia4-ia-main Globo-Front-main/src-tauri/resources/

      - name: Copy essential files to resources (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path "Globo-Front-main/src-tauri/resources"
          Copy-Item "docker-compose.yml" -Destination "Globo-Front-main/src-tauri/resources/"
          Copy-Item ".env" -Destination "Globo-Front-main/src-tauri/resources/"
          Copy-Item "residencia4-backend-master" -Destination "Globo-Front-main/src-tauri/resources/" -Recurse
          Copy-Item "residencia4-ia-main" -Destination "Globo-Front-main/src-tauri/resources/" -Recurse

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: Globo-Front-main/src-tauri/resources/docker-images/

      - name: Download Docker Desktop Installer (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path "Globo-Front-main/src-tauri/resources/installers"
          # Download Docker Desktop for Windows
          Invoke-WebRequest -Uri "https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe" -OutFile "Globo-Front-main/src-tauri/resources/installers/docker-desktop-installer.exe"
          # Verificar se o arquivo foi baixado
          if (Test-Path "Globo-Front-main/src-tauri/resources/installers/docker-desktop-installer.exe") {
            Write-Host "Docker Desktop Installer baixado com sucesso"
          } else {
            Write-Error "Falha ao baixar Docker Desktop Installer"
            exit 1
          }

      - name: Download Docker Desktop Installer (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p Globo-Front-main/src-tauri/resources/installers
          # Download Docker Desktop for macOS (Intel)
          curl -L "https://desktop.docker.com/mac/main/amd64/Docker.dmg" -o Globo-Front-main/src-tauri/resources/installers/Docker.dmg
          # Download Docker Desktop for macOS (Apple Silicon)
          curl -L "https://desktop.docker.com/mac/main/arm64/Docker.dmg" -o Globo-Front-main/src-tauri/resources/installers/Docker-ARM64.dmg || true

      - name: Create setup scripts (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p Globo-Front-main/src-tauri/scripts
          
          # macOS setup script
          cat > Globo-Front-main/src-tauri/scripts/setup-docker.sh << 'EOF'
          #!/bin/bash
          # Docker Embedded Setup Script for macOS
          echo "Verificando Docker Desktop..."
          
          if ! command -v docker &> /dev/null; then
              echo "Instalando Docker Desktop..."
              # Mount and install Docker.dmg
              hdiutil attach "./resources/installers/Docker.dmg"
              cp -R "/Applications/Docker.app" "/Applications/"
              hdiutil detach "/Volumes/Docker"
              
              echo "Aguardando inicialização do Docker..."
              sleep 30
              
              # Carregar imagens Docker
              echo "Carregando imagens Docker..."
              docker load -i "./resources/docker-images/postgres.tar"
              docker load -i "./resources/docker-images/backend.tar"
              docker load -i "./resources/docker-images/ia-service.tar"
          fi
          
          echo "Docker configurado com sucesso!"
          EOF
          chmod +x Globo-Front-main/src-tauri/scripts/setup-docker.sh

      - name: Create setup scripts (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mkdir -p Globo-Front-main/src-tauri/scripts
          
          # Linux setup script - install Docker using official script
          cat > Globo-Front-main/src-tauri/scripts/setup-docker.sh << 'EOF'
          #!/bin/bash
          # Docker Embedded Setup Script for Linux
          echo "Verificando Docker..."
          
          if ! command -v docker &> /dev/null; then
              echo "Instalando Docker..."
              # Install Docker using official script
              curl -fsSL https://get.docker.com -o get-docker.sh
              sh get-docker.sh
              
              # Start Docker service
              sudo systemctl start docker
              sudo systemctl enable docker
              
              echo "Aguardando inicialização do Docker..."
              sleep 10
              
              # Carregar imagens Docker
              echo "Carregando imagens Docker..."
              sudo docker load -i "./resources/docker-images/postgres.tar"
              sudo docker load -i "./resources/docker-images/backend.tar"
              sudo docker load -i "./resources/docker-images/ia-service.tar"
          fi
          
          echo "Docker configurado com sucesso!"
          EOF
          chmod +x Globo-Front-main/src-tauri/scripts/setup-docker.sh

      - name: Create setup scripts (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          mkdir -p Globo-Front-main/src-tauri/scripts
          
          # Windows setup script
          @"
          # Docker Embedded Setup Script for Windows
          Write-Host "Verificando Docker Desktop..."
          
          if (!(Get-Command docker -ErrorAction SilentlyContinue)) {
              Write-Host "Instalando Docker Desktop..."
              Start-Process -Wait -FilePath ".\resources\installers\docker-desktop-installer.exe" -ArgumentList "install", "--quiet"
              
              Write-Host "Aguardando inicialização do Docker..."
              Start-Sleep -Seconds 30
              
              # Carregar imagens Docker
              Write-Host "Carregando imagens Docker..."
              docker load -i ".\resources\docker-images\postgres.tar"
              docker load -i ".\resources\docker-images\backend.tar"
              docker load -i ".\resources\docker-images\ia-service.tar"
          }
          
          Write-Host "Docker configurado com sucesso!"
          "@ | Out-File -FilePath "Globo-Front-main/src-tauri/scripts/setup-docker.ps1" -Encoding UTF8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Globo-Front-main/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install pkg-config glib gtk+3

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Ensure all resource files exist (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: Globo-Front-main/src-tauri
        run: |
          # Criar arquivos placeholder se não existirem
          if (!(Test-Path "resources/docker-images/postgres.tar")) {
            New-Item -ItemType File -Path "resources/docker-images/postgres.tar" -Force
          }
          if (!(Test-Path "resources/docker-images/backend.tar")) {
            New-Item -ItemType File -Path "resources/docker-images/backend.tar" -Force
          }
          if (!(Test-Path "resources/docker-images/ia-service.tar")) {
            New-Item -ItemType File -Path "resources/docker-images/ia-service.tar" -Force
          }
          if (!(Test-Path "resources/installers/docker-desktop-installer.exe")) {
            New-Item -ItemType File -Path "resources/installers/docker-desktop-installer.exe" -Force
          }
          if (!(Test-Path "resources/installers/Docker.dmg")) {
            New-Item -ItemType File -Path "resources/installers/Docker.dmg" -Force
          }
          if (!(Test-Path "resources/installers/Docker-ARM64.dmg")) {
            New-Item -ItemType File -Path "resources/installers/Docker-ARM64.dmg" -Force
          }

      - name: Ensure all resource files exist (Unix)
        if: matrix.platform != 'windows-latest'
        working-directory: Globo-Front-main/src-tauri
        run: |
          # Criar arquivos placeholder se não existirem
          mkdir -p resources/docker-images
          mkdir -p resources/installers
          touch resources/docker-images/postgres.tar
          touch resources/docker-images/backend.tar
          touch resources/docker-images/ia-service.tar
          touch resources/installers/docker-desktop-installer.exe
          touch resources/installers/Docker.dmg
          touch resources/installers/Docker-ARM64.dmg

      - name: Install frontend dependencies
        working-directory: Globo-Front-main
        run: npm install --legacy-peer-deps

      - name: Build Frontend
        working-directory: Globo-Front-main
        run: npm run build

      - name: Copy resources to Tauri directory
        run: |
          # Copy docker-compose.yml and other resources to the correct location
          cp docker-compose.yml Globo-Front-main/src-tauri/resources/
          cp .env Globo-Front-main/src-tauri/resources/
          cp -r residencia4-backend-master Globo-Front-main/src-tauri/resources/
          cp -r residencia4-ia-main Globo-Front-main/src-tauri/resources/
          
      - name: Ensure scripts exist
        working-directory: Globo-Front-main/src-tauri
        run: |
          # Garantir que os scripts existam antes do build
          mkdir -p scripts
          if [ ! -f "scripts/setup-docker.ps1" ]; then
            echo '# Docker setup script for Windows' > scripts/setup-docker.ps1
          fi
          if [ ! -f "scripts/setup-docker.sh" ]; then
            echo '#!/bin/bash' > scripts/setup-docker.sh
            echo '# Docker setup script for Unix' >> scripts/setup-docker.sh
            chmod +x scripts/setup-docker.sh
          fi

      - name: Build Tauri app with embedded Docker (macOS)
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: Globo-Front-main/src-tauri
          configPath: tauri-macos.conf.json
          tagName: ${{ github.ref_name }}-docker-embedded
          releaseName: 'Globo Monitor Docker Embedded v__VERSION__'
          releaseBody: 'Versão com Docker Desktop e imagens pré-carregadas incluídas no instalador.'
          releaseDraft: true
          prerelease: false

      - name: Build Tauri app with embedded Docker (Windows/Linux)
        if: matrix.platform != 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: Globo-Front-main/src-tauri
          tagName: ${{ github.ref_name }}-docker-embedded
          releaseName: 'Globo Monitor Docker Embedded v__VERSION__'
          releaseBody: 'Versão com Docker Desktop e imagens pré-carregadas incluídas no instalador.'
          releaseDraft: true
          prerelease: false

      - name: Upload embedded artifacts
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v4
        with:
          name: globo-monitor-docker-embedded-${{ matrix.platform }}
          path: |
            Globo-Front-main/src-tauri/target/release/bundle/msi/*.msi
            Globo-Front-main/src-tauri/target/release/bundle/nsis/*.exe
            Globo-Front-main/src-tauri/target/release/bundle/dmg/*.dmg
            Globo-Front-main/src-tauri/target/release/bundle/deb/*.deb
            Globo-Front-main/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

  create-release:
    needs: build-tauri-embedded
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}-docker-embedded
          name: 🎬 Globo Monitor v${{ github.run_number }} - Docker Embarcado
          body: |
            # 🎬 Globo Monitor v${{ github.run_number }}
            
            Sistema completo de monitoramento de qualidade de vídeo com Inteligência Artificial.
            
            ## ✨ Novidades
            - 📦 **Docker Embarcado**: Todos os serviços incluídos no instalador
            - 🚀 **Instalação Automática**: Docker Desktop e imagens pré-carregadas
            - 🖥️ **Multi-plataforma**: Windows, macOS e Linux
            
            ## 📋 Requisitos
            - Windows 10/11, macOS 10.15+, ou Linux moderno
            - 4GB RAM mínimo
            - 2GB espaço em disco
            
            ## 🔧 Instalação
            1. Baixe o instalador para seu sistema operacional
            2. Execute o instalador
            3. O aplicativo iniciará automaticamente com todos os serviços
            
            ## 🎯 Funcionalidades
            - Monitoramento em tempo real
            - Detecção de falhas de áudio/vídeo
            - Análise de inteligibilidade
            - Detecção de lip-sync
            - Dashboard interativo
            - Notificações automáticas
            
            ## 🐳 Tecnologias Incluídas
            - PostgreSQL 15
            - FastAPI Backend
            - IA com PyTorch/TensorFlow
            - Angular 20 + Tauri 2
            - Docker Compose
            
            ---
            **Instaladores pré-configurados com todos os serviços Docker**
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}