name: 'Build Docker Embedded (macOS Only)'

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    # Executar automaticamente toda segunda-feira às 9h
    - cron: '0 9 * * 1'

permissions:
  contents: write

jobs:
  build-docker-images:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space (Ubuntu)
        run: |
          # Limpeza agressiva de espaço em disco
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "Espaço após limpeza inicial:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PostgreSQL image
        run: |
          docker pull postgres:15-alpine
          docker save postgres:15-alpine -o postgres.tar

      - name: Build Backend image
        run: |
          cd residencia4-backend-master
          docker build -t globo-backend:latest .
          docker save globo-backend:latest -o ../backend.tar

      - name: Build IA Service image
        run: |
          cd residencia4-ia-main
          docker build -t globo-ia:latest .
          docker save globo-ia:latest -o ../ia-service.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-embedded
          path: |
            postgres.tar
            backend.tar
            ia-service.tar
          retention-days: 1
          compression-level: 6

  build-tauri:
    needs: build-docker-images
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest]
        # Apenas macOS - Windows e Linux serão construídos localmente

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images-embedded
          path: docker-images/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Globo-Front-main/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (macOS)
        run: |
          # Verificar se os pacotes já estão instalados antes de instalar
          brew list pkg-config || brew install pkg-config
          brew list glib || brew install glib

      - name: Copy essential files to resources (macOS)
        run: |
          mkdir -p Globo-Front-main/src-tauri/resources
          cp docker-compose.yml Globo-Front-main/src-tauri/resources/
          cp .env Globo-Front-main/src-tauri/resources/
          cp -r residencia4-backend-master Globo-Front-main/src-tauri/resources/
          cp -r residencia4-ia-main Globo-Front-main/src-tauri/resources/
          cp -r docker-images Globo-Front-main/src-tauri/resources/

      - name: Validate downloaded Docker images (macOS)
        run: |
          echo "Validando arquivos de imagens Docker baixados:"
          ls -la Globo-Front-main/src-tauri/resources/docker-images/
          for file in Globo-Front-main/src-tauri/resources/docker-images/*.tar; do
            if [ -f "$file" ]; then
              size=$(stat -f%z "$file" 2>/dev/null || echo "0")
              echo "$(basename "$file"): $size bytes"
              if [ "$size" -lt 1000 ]; then
                echo "⚠️  Arquivo pequeno detectado: $file"
              fi
            fi
          done

      - name: Install frontend dependencies
        working-directory: Globo-Front-main
        run: npm install --legacy-peer-deps

      - name: Build Frontend
        working-directory: Globo-Front-main
        run: npm run build

      - name: Ensure all resource files exist (macOS)
        working-directory: Globo-Front-main/src-tauri
        run: |
          # Criar arquivos placeholder apenas se não existirem (preservar arquivos baixados)
          mkdir -p resources/docker-images
          if [ ! -f "resources/docker-images/postgres.tar" ]; then
            echo "Criando placeholder postgres.tar"
            touch resources/docker-images/postgres.tar
          else
            size=$(stat -f%z "resources/docker-images/postgres.tar" 2>/dev/null || echo "0")
            echo "postgres.tar já existe (tamanho: $size bytes)"
            if [ "$size" -eq 0 ]; then
              echo "ARQUIVO VAZIO - criando placeholder substituto"
              rm -f resources/docker-images/postgres.tar
              touch resources/docker-images/postgres.tar
            fi
          fi
          if [ ! -f "resources/docker-images/backend.tar" ]; then
            echo "Criando placeholder backend.tar"
            touch resources/docker-images/backend.tar
          else
            size=$(stat -f%z "resources/docker-images/backend.tar" 2>/dev/null || echo "0")
            echo "backend.tar já existe (tamanho: $size bytes)"
            if [ "$size" -eq 0 ]; then
              echo "ARQUIVO VAZIO - criando placeholder substituto"
              rm -f resources/docker-images/backend.tar
              touch resources/docker-images/backend.tar
            fi
          fi
          if [ ! -f "resources/docker-images/ia-service.tar" ]; then
            echo "Criando placeholder ia-service.tar"
            touch resources/docker-images/ia-service.tar
          else
            size=$(stat -f%z "resources/docker-images/ia-service.tar" 2>/dev/null || echo "0")
            echo "ia-service.tar já existe (tamanho: $size bytes)"
            if [ "$size" -eq 0 ]; then
              echo "ARQUIVO VAZIO - criando placeholder substituto"
              rm -f resources/docker-images/ia-service.tar
              touch resources/docker-images/ia-service.tar
            fi
          fi

      - name: Ensure scripts exist (macOS)
        working-directory: Globo-Front-main/src-tauri
        run: |
          # Garantir que os scripts existam antes do build
          mkdir -p scripts
          if [ ! -f "scripts/setup-docker.ps1" ]; then
            echo '# Docker setup script for Windows' > scripts/setup-docker.ps1
          fi
          if [ ! -f "scripts/setup-docker.sh" ]; then
            echo '#!/bin/bash' > scripts/setup-docker.sh
            echo '# Docker setup script for Unix' >> scripts/setup-docker.sh
            chmod +x scripts/setup-docker.sh
          fi

      - name: Build Tauri app with embedded Docker (macOS)
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: Globo-Front-main/src-tauri
          tagName: ${{ github.ref_name }}-docker-embedded
          releaseName: 'Globo Monitor Docker Embedded v__VERSION__'
          releaseBody: 'Versão com Docker Desktop e imagens pré-carregadas incluídas no instalador (macOS).'
          releaseDraft: true
          prerelease: false
          args: --config tauri-macos.conf.json

      - name: Upload embedded artifacts
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v4
        with:
          name: globo-monitor-docker-embedded-${{ matrix.platform }}
          path: |
            Globo-Front-main/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
          compression-level: 6
          retention-days: 30

  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: globo-monitor-docker-embedded-*
          path: artifacts/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-docker-embedded
          name: 'Globo Monitor Docker Embedded v${{ github.ref_name }}'
          body: |
            ## 🍎 Versão macOS com Docker Embedded
            
            Esta versão inclui:
            - ✨ Frontend Angular integrado
            - 🐳 Imagens Docker pré-carregadas (PostgreSQL, Backend, IA Service)
            - 📋 Docker Compose configurado
            - 🚀 Instalação completa com um clique
            
            ### 📦 Arquivos Incluídos:
            - `Globo Monitor_[versão]_universal.dmg` - Instalador macOS universal
            
            ### 🎯 Como Usar:
            1. Baixe o arquivo `.dmg`
            2. Instale o aplicativo
            3. Execute o Globo Monitor
            4. O Docker será configurado automaticamente
            
            ### 🐧 Windows e Linux:
            Para Windows e Linux, use os builds locais com os scripts de preparação:
            - Windows: `prepara-bundle-windows.ps1`
            - Linux: `prepara-bundle-linux.sh`
            
            ---
            **Nota**: Esta é uma versão com Docker embedded. Para versões sem Docker, use o workflow padrão.
          draft: true
          prerelease: false
          files: |
            artifacts/**/*
            docker-images/*.tar